name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"        # nightly: full eval gate against fresh dependency resolution
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check convoiq tests scripts
      - run: python scripts/gen_infra.py --check
      - name: train models (cached on code+data hash)
        uses: actions/cache@v4
        id: models
        with:
          path: models
          key: models-${{ hashFiles('convoiq/**/*.py', 'data/**', 'requirements.txt') }}
      - if: steps.models.outputs.cache-hit != 'true'
        run: python -m convoiq.training.train_all --split all --out models
      - run: python -m pytest tests/v2

  eval-gate:
    needs: test
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-eval')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m convoiq.training.train_all --split train --out models_eval
      - run: python -m convoiq.evals.runner --models models_eval --out reports
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: reports/ }

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., target: runtime, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
