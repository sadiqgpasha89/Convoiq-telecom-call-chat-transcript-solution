[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "convoiq"
version = "2.0.0"
description = "ConvoIQ telecom conversation intelligence: microservices on GCP (Cloud Run, Pub/Sub, BigQuery, Firestore)"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["convoiq*"]

[tool.pytest.ini_options]
testpaths = ["tests/v2"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 160
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007", "UP045"]
